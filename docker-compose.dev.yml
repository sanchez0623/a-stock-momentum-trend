# 开发模式: backend 热重载(8002) + frontend Vite HMR(5173)
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: momentum-backend-dev
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app/backend        # 源码热重载
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - DATA_DIR=/app/data
    env_file:
      - .env
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8002

  frontend:
    image: node:22-alpine
    container_name: momentum-frontend-dev
    working_dir: /app/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      - TZ=Asia/Shanghai
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  frontend_node_modules:
