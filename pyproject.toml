# ============================================================
# 后端工具链配置(ruff / pytest / mypy)
# ============================================================
[project]
name = "momentum-trader-backend"
version = "0.1.0"
description = "个人动量趋势交易系统 - 后端"
requires-python = ">=3.11"

[project.optional-dependencies]
# 可选数据源(重依赖, 按需安装; CI 不安装以保确定性)
optional = [
    "mootdx>=0.11",
    "akshare>=1.14",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",      # 行长不强制
    "UP007",     # X | None 语法放宽(兼容 3.10 写法的可读性)
    "UP035",     # typing 导入风格放宽
    "SIM108",    # 三元表达式不强制
    "B008",      # FastAPI 依赖注入 Depends() 在参数默认值中是标准写法
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "S101"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["tests/"]
